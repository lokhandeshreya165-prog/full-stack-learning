<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset = "UTF-8">
        <meta http-equiv="X-UA-compatible" content="IE-edge">
        <meta name="viewport" content="width-device-width, initial-scale=1.0">
        <title>dom learning day 2</title>
    </head>
    <body style = "background-color:#212121; color: #fff;">
        <div class = "parent">
            <div class ="day">Monday</div>
            <div class ="day">tuesday</div>
            <div class = "day">wednusday</div>
            <div class = "day">thursday</div>
            <div class = "day">friday</div>
            <div class = "day">saturday</div>
        </div>
    </body>
    <script>
        const parent = document.querySelector('.parent')
        console.log(parent);
        console.log(parent.children);
        console.log(parent.children[1].innerHTML);

        for(let i = 0; i<parent.children.length; i++){
            console.log(parent.children[i].innerHTML);
        }
        parent.children[1].style.color = "orange"
        console.log(parent.firstElementChild);
        console.log(parent.lastElementChild);

        const dayone = document.querySelector('.day')
        console.log(dayone);
        console.log(dayone.parentElement);
        console.log(dayone.nextElementSibling);
    
    //topic-2-->
        const div= document.createElement('h1')
        console.log(div);
        div.className = "main"
        //create random id by own
        div.id = Math.round(Math.random()* 10 +1)
        div.setAttribute("title","generative title")
        div.style.backgroundColor = "blue"
        div.style.padding = "12px"
        //addtext in div
        const addtext = document.createTextNode("shreya lokhande")
        div.appendChild(addtext)

        //add created div-text in page
        document.body.appendChild(div)
    
    //create and remove DOM
        //create
        function addLanguage(langName){
            const li = document.createElement('li');
            li.innerHTML = `${langName}`
            document.querySelector('.parent').appendChild(li)
        }
        addLanguage("python")
        addLanguage("typescript")

        function addOptiLanguage(langName){
            const li = document.createElement('li');
            li.appendChild(document.createTextNode(langName));
            document.querySelector('.parent').appendChild(li);
        }
        addOptiLanguage('golang');

        //Edit
        const day = document.querySelector(".day:nth-child(3)");
        day.textContent = "holiday";     //replace : wednusday to holiday

        //remove
        const day6 = document.querySelector(".day:nth-child(6)");
        day6.remove();      //remove saturday



    
    </script>
</html>
